# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build Modified Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Identify modified modules
        id: detect_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          if [ ! -f pom.xml ]; then
            echo "No root pom.xml found" >&2
            exit 1
          fi

          ROOT_MODULES=$(awk '
            /<modules>/ { in_modules=1; next }
            /<\/modules>/ { in_modules=0 }
            in_modules && match($0, /<module>([^<]+)<\/module>/, m) { print m[1] }
          ' pom.xml)

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")

          if echo "$CHANGED_FILES" | grep -Eq '^(pom\.xml|\.mvn/|\.github/workflows/)'; then
            echo "services=ALL" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MODIFIED_SERVICES=$(printf '%s\n' "$CHANGED_FILES" \
            | awk -F'/' -v modules="$ROOT_MODULES" '
                BEGIN {
                  n = split(modules, arr, "\n")
                  for (i = 1; i <= n; i++) {
                    if (arr[i] != "") valid[arr[i]] = 1
                  }
                }
                NF > 1 && valid[$1] { print $1 }
              ' \
            | sort -u \
            | tr '\n' ' ')

          echo "services=$MODIFIED_SERVICES" >> "$GITHUB_OUTPUT"

      - name: Build modified modules
        shell: bash
        run: |
          if [ "${{ steps.detect_changes.outputs.services }}" = "ALL" ]; then
            echo "Building full Maven reactor..."
            mvn clean install
            exit 0
          fi

          if [ -z "${{ steps.detect_changes.outputs.services }}" ]; then
            echo "No module changes detected."
            exit 0
          fi

          for SERVICE in ${{ steps.detect_changes.outputs.services }}; do
            echo "Building $SERVICE..."
            mvn -f "$SERVICE/pom.xml" clean install
          done